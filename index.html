<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DART App</title>

    <script>
        const androidURL =
            "https://play.google.com/store/apps/details?id=com.twowaydigitalmedia.dart";

        const iosURL =
            "https://apps.apple.com/ng/app/dart-food-bird/id6778033966";

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;

        // Android
        if (/android/i.test(userAgent)) {
            window.location.replace(androidURL);
        }

        // iPhone / iPad / iPod
        else if (/iPhone|iPad|iPod/i.test(userAgent)) {
            window.location.replace(iosURL);
        }

        // Other devices
        else {
            document.addEventListener("DOMContentLoaded", function () {
                document.getElementById("message").innerHTML =
                    "Please scan this QR code using your Android or iPhone.";
            });
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>DART App</h1>

    <p id="message">
        Redirecting you to the DART App...
    </p>

</body>
</html>
